<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Speak Editor - Gateway Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
    header { background: #16213e; padding: 16px 24px; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; color: #fff; }
    header span { font-size: 13px; color: #888; }
    main { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #ccc; }

    .add-form { display: flex; gap: 8px; margin-bottom: 24px; }
    .add-form input { flex: 1; padding: 10px 14px; background: #16213e; border: 1px solid #0f3460; border-radius: 6px; color: #e0e0e0; font-size: 14px; outline: none; }
    .add-form input:focus { border-color: #e94560; }
    .add-form input::placeholder { color: #666; }
    .add-form button { padding: 10px 20px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; }
    .add-form button:hover { background: #c73e54; }

    table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 8px; overflow: hidden; }
    th { text-align: left; padding: 10px 14px; background: #0f3460; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; }
    td { padding: 10px 14px; border-top: 1px solid #1a1a2e; font-size: 14px; vertical-align: middle; }
    tr:hover td { background: #1a2240; }

    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-dot.healthy { background: #4ade80; }
    .status-dot.unhealthy { background: #f87171; }
    .status-dot.unknown { background: #888; }
    .status-text { font-size: 12px; color: #888; }

    .toggle { position: relative; width: 40px; height: 22px; display: inline-block; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #444; border-radius: 22px; transition: 0.2s; }
    .toggle .slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
    .toggle input:checked + .slider { background: #4ade80; }
    .toggle input:checked + .slider:before { transform: translateX(18px); }

    .btn { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-edit { background: #3b82f6; color: #fff; }
    .btn-edit:hover { background: #2563eb; }
    .btn-delete { background: #ef4444; color: #fff; margin-left: 4px; }
    .btn-delete:hover { background: #dc2626; }

    .actions { white-space: nowrap; }
    .muted { color: #666; font-size: 12px; }
    .endpoint { font-family: monospace; font-size: 13px; word-break: break-all; }
    .jobs { font-variant-numeric: tabular-nums; }

    .empty { text-align: center; padding: 40px; color: #666; }
    .error-toast { position: fixed; bottom: 20px; right: 20px; background: #ef4444; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 100; display: none; }
    .success-toast { position: fixed; bottom: 20px; right: 20px; background: #4ade80; color: #1a1a2e; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 100; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Gateway Admin</h1>
    <span>Render Backend Management</span>
  </header>

  <main>
    <h2>Add Backend</h2>
    <form class="add-form" id="add-form">
      <input type="text" id="endpoint-input" placeholder="http://192.168.1.10:3100" required>
      <button type="submit">Add Backend</button>
    </form>

    <h2>Render Backends</h2>
    <table>
      <thead>
        <tr>
          <th>Endpoint</th>
          <th>Status</th>
          <th>Active Jobs</th>
          <th>Total Jobs</th>
          <th>Added</th>
          <th>Last Job</th>
          <th>Active</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="backends-tbody">
        <tr><td colspan="8" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </main>

  <div class="error-toast" id="error-toast"></div>
  <div class="success-toast" id="success-toast"></div>

  <script>
    function timeAgo(dateStr) {
      if (!dateStr) return '-';
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      return days + 'd ago';
    }

    function showToast(type, msg) {
      const el = document.getElementById(type + '-toast');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    async function loadBackends() {
      try {
        const res = await fetch('/api/backends');
        const backends = await res.json();
        const tbody = document.getElementById('backends-tbody');

        if (backends.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="empty">No backends registered. Add one above.</td></tr>';
          return;
        }

        tbody.innerHTML = backends.map(b => {
          const h = b.health || {};
          const statusClass = h.lastChecked == null ? 'unknown' : (h.healthy ? 'healthy' : 'unhealthy');
          const statusLabel = h.lastChecked == null ? 'Pending' : (h.healthy ? 'Healthy' : (h.error || 'Unhealthy'));
          const jobsText = h.lastChecked ? `${h.activeJobs} / ${h.maxConcurrentJobs}` : '-';

          return `<tr>
            <td class="endpoint">${escHtml(b.apiEndpoint)}</td>
            <td><span class="status-dot ${statusClass}" title="${escHtml(statusLabel)}"></span><span class="status-text">${escHtml(statusLabel)}</span></td>
            <td class="jobs">${jobsText}</td>
            <td class="jobs">${b.countJobsTotal}</td>
            <td class="muted">${timeAgo(b.addedOn)}</td>
            <td class="muted">${timeAgo(b.lastJobOn)}</td>
            <td>
              <label class="toggle">
                <input type="checkbox" ${b.isActive ? 'checked' : ''} onchange="toggleActive('${b._id}', this.checked)">
                <span class="slider"></span>
              </label>
            </td>
            <td class="actions">
              <button class="btn btn-edit" onclick="editEndpoint('${b._id}', '${escAttr(b.apiEndpoint)}')">Edit</button>
              <button class="btn btn-delete" onclick="removeBackend('${b._id}')">Delete</button>
            </td>
          </tr>`;
        }).join('');
      } catch (err) {
        showToast('error', 'Failed to load backends');
      }
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function escAttr(s) {
      return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('endpoint-input');
      const apiEndpoint = input.value.trim();
      if (!apiEndpoint) return;

      try {
        const res = await fetch('/api/backends', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiEndpoint })
        });

        if (res.status === 409) {
          showToast('error', 'Backend already exists');
          return;
        }
        if (!res.ok) {
          const data = await res.json();
          showToast('error', data.error || 'Failed to add');
          return;
        }

        input.value = '';
        showToast('success', 'Backend added');
        loadBackends();
      } catch (err) {
        showToast('error', 'Failed to add backend');
      }
    });

    async function toggleActive(id, isActive) {
      try {
        await fetch(`/api/backends/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isActive })
        });
        loadBackends();
      } catch (err) {
        showToast('error', 'Failed to update');
      }
    }

    async function editEndpoint(id, current) {
      const newEndpoint = prompt('Edit API endpoint:', current);
      if (!newEndpoint || newEndpoint === current) return;

      try {
        const res = await fetch(`/api/backends/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiEndpoint: newEndpoint.replace(/\/+$/, '') })
        });

        if (!res.ok) {
          const data = await res.json();
          showToast('error', data.error || 'Failed to update');
          return;
        }

        showToast('success', 'Endpoint updated');
        loadBackends();
      } catch (err) {
        showToast('error', 'Failed to update');
      }
    }

    async function removeBackend(id) {
      if (!confirm('Delete this backend?')) return;

      try {
        await fetch(`/api/backends/${id}`, { method: 'DELETE' });
        showToast('success', 'Backend removed');
        loadBackends();
      } catch (err) {
        showToast('error', 'Failed to delete');
      }
    }

    // Initial load + auto-refresh
    loadBackends();
    setInterval(loadBackends, 10000);
  </script>
</body>
</html>
