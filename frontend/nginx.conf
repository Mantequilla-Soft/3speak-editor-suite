server {
    listen 80;
    server_name 3speak-editor.okinoko.io localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — needed for variable-based proxy_pass to resolve at runtime
    resolver 127.0.0.11 valid=30s;

    # Allow large uploads server-wide (nginx default is 1MB)
    client_max_body_size 2g;

    # COEP for SharedArrayBuffer (FFmpeg.wasm); COOP unsafe-none to allow iframe embedding
    add_header Cross-Origin-Opener-Policy "unsafe-none" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # Static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # Proxy API to backend
    location /api/ {
        proxy_pass http://backend:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2g;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Proxy gateway (strip /gateway prefix)
    # Use variable so nginx doesn't fail at startup when gateway is not running
    location /gateway/ {
        set $gateway_upstream http://gateway:3200;
        rewrite ^/gateway/(.*) /$1 break;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Serve rendered output files (CORS enabled for parent site to fetch)
    location /rendered/ {
        alias /usr/share/nginx/rendered/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # index.html — never cache (so new builds are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
